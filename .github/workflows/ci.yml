name: CI

# El repositorio no tenía ningún workflow. Las pruebas solo protegen si
# algo las ejecuta sin que nadie se acuerde de hacerlo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela la ejecución anterior: no tiene
# sentido gastar minutos verificando un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: Frontend — lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Coincide con .nvmrc del proyecto de plataforma y con el Node local.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        # `npm ci` respeta el lockfile: una CI que resuelve versiones nuevas por
        # su cuenta verifica un árbol distinto del que se despliega.
        run: npm ci

      - name: Lint
        # El proyecto arrastra problemas previos en pantallas sin migrar, así
        # que ESLint no puede exigir cero todavía. Se ejecuta para que las
        # anotaciones aparezcan en el PR.
        run: npm run lint
        continue-on-error: true

      - name: Trinquete de lint
        # Este SÍ falla la build. Deja de ser informativo: compara con un techo
        # versionado (77 desde la Fase 3, antes 84) y protesta si SUBE.
        run: npm run lint:budget

      - name: Guardarraíl de tokens del sistema de diseño
        # Este SÍ falla la build: compara contra una línea base versionada y
        # solo protesta si la deuda visual AUMENTA.
        run: npm run tokens:check

      - name: Integridad del código vendorizado
        # `src/ui/` es una copia del paquete de diseño y no se edita aquí. Sin
        # esta comprobación la regla es sólo un comentario: un parche local
        # sobrevive hasta la siguiente sincronización, que lo borra en silencio.
        # En CI el paquete no está al lado, así que se verifica contra el
        # manifiesto de hashes versionado.
        run: npm run check:vendor

      - name: Comprobación de tipos
        # Cubre el paquete de UI vendorizado, que se mantiene en TypeScript.
        run: npm run typecheck

      - name: Pruebas
        # Incluye la matriz de autorización, las barreras de diseño, la
        # equivalencia de negocio del panel con main y el análisis de
        # accesibilidad con axe-core de las pantallas migradas.
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Guardar el build para inspección
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Backend — contrato de reservas de stock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `defaults.run.working-directory` apunta a `frontend/`; aquí se trabaja en
    # la raíz del repositorio, donde viven `main.py` y `tests/`.
    defaults:
      run:
        working-directory: .

    services:
      # Las pruebas de reserva se ejecutan contra PostgreSQL DE VERDAD. La regla
      # es una consulta con filtros sobre estados, fechas y cantidades: un doble
      # del ORM devolvería lo que le pidiéramos y no probaría nada.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivero
          POSTGRES_PASSWORD: vivero
          POSTGRES_DB: vivero_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vivero -d vivero_pruebas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        # `requirements-dev.txt` incluye a `requirements.txt` y añade pytest.
        run: pip install -r requirements-dev.txt

      - name: Pruebas del contrato de reservas
        # Fija qué estados RESERVAN y cuáles LIBERAN, que es lo que decide
        # cuántas unidades se pueden pedir de cada producto. Antes de esta fase
        # el backend no tenía ni una prueba.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vivero:vivero@localhost:5432/vivero_pruebas
          DATABASE_URL: postgresql+psycopg://vivero:vivero@localhost:5432/vivero_pruebas
        run: python -m pytest tests/ -q
