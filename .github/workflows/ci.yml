name: CI

# El repositorio no tenía ningún workflow. Las pruebas solo protegen si
# algo las ejecuta sin que nadie se acuerde de hacerlo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela la ejecución anterior: no tiene
# sentido gastar minutos verificando un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: Frontend — lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Coincide con .nvmrc del proyecto de plataforma y con el Node local.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        # `npm ci` respeta el lockfile: una CI que resuelve versiones nuevas por
        # su cuenta verifica un árbol distinto del que se despliega.
        run: npm ci

      - name: Lint
        # El proyecto arrastra problemas previos en pantallas sin migrar, así
        # que ESLint no puede exigir cero todavía. Se ejecuta para que las
        # anotaciones aparezcan en el PR.
        run: npm run lint
        continue-on-error: true

      - name: Trinquete de lint
        # Este SÍ falla la build. Deja de ser informativo: compara con un techo
        # versionado (77 desde la Fase 3, antes 84) y protesta si SUBE.
        run: npm run lint:budget

      - name: Guardarraíl de tokens del sistema de diseño
        # Este SÍ falla la build: compara contra una línea base versionada y
        # solo protesta si la deuda visual AUMENTA.
        run: npm run tokens:check

      - name: Integridad del código vendorizado
        # `src/ui/` es una copia del paquete de diseño y no se edita aquí. Sin
        # esta comprobación la regla es sólo un comentario: un parche local
        # sobrevive hasta la siguiente sincronización, que lo borra en silencio.
        # En CI el paquete no está al lado, así que se verifica contra el
        # manifiesto de hashes versionado.
        run: npm run check:vendor

      - name: Comprobación de tipos
        # Cubre el paquete de UI vendorizado, que se mantiene en TypeScript.
        run: npm run typecheck

      - name: Pruebas
        # Incluye la matriz de autorización, las barreras de diseño, la
        # equivalencia de negocio del panel con main y el análisis de
        # accesibilidad con axe-core de las pantallas migradas.
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Guardar el build para inspección
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: ignore
